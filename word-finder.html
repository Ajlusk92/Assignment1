<!DOCTYPE html>

<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Word Finder</title>

<script type="text/javascript" src="jquery-1.5.min.js"></script>
<script type="text/javascript" src="words-small.json"></script>
<script type="text/javascript" src="dictionary.js"></script>

<script type="text/javascript">

$(document).ready(function () {

    var dict = new Dictionary(words);

    function updateWordList(wordArray) {
        $("#wordList").empty();

        $.each(wordArray, function (index, word) {
            $("#wordList").append(
                $("<option></option>").text(word)
            );
        });
    }

    function showAllWords() {
        var allWords = dict.all();

        updateWordList(allWords);

        $("#status").text(allWords.length + " words total");
    }

    function searchWords() {
        var query = $("#query").val();

        if (query === "") {
            showAllWords();
            return;
        }

        var results = dict.search(query);

        updateWordList(results);

        $("#status").text(
            results.length + " words containing '" + query + "'"
        );
    }

    showAllWords();

    $("#query").keyup(searchWords);

    $("#clearBtn").click(function () {
        $("#query").val("");
        showAllWords();
        $("#query").focus();
    });

});

</script>

<style type="text/css">

html, body {
    height: 100%;
    margin: 0;
    background-color: #eee;
    font-family: Arial, sans-serif;
}

#container {
    margin: 20px;
    height: calc(100% - 40px);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

#searchBar {
    display: flex;
    align-items: center;
    gap: 10px;
}

#query {
    flex: 1;
    padding: 4px;
}

#status {
    font-weight: bold;
}

#wordList {
    flex: 1;
    width: 100%;
}

</style>

</head>

<body>

<div id="container">

    <div id="searchBar">
        <label for="query">Find:</label>
        <input type="text" id="query">
        <button id="clearBtn">Clear</button>
    </div>

    <div id="status">0 words total</div>

    <select id="wordList" size="20"></select>

</div>

</body>
</html>
